name: Release (GitHub)

# Runs on a tag. Everything here is reversible: GitHub Packages versions can be
# deleted and a draft release can be discarded, so this is the rehearsal.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # create the release
  packages: write   # push to GitHub Packages

jobs:
  stage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # The tag is the single source of truth for the version, so a published
      # package and the commit it came from can never disagree. v0.1.0 -> 0.1.0
      - name: Derive the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test -c Release --verbosity normal

      - name: Verify the packages
        run: ./scripts/test-package.sh

      - name: Pack
        run: |
          dotnet pack src/Banner            -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts
          dotnet pack src/DotNetBanner.Tool -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts

      # A real push over HTTP with real authentication -- everything nuget.org
      # does, except that these versions can be deleted if something is wrong.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      # Draft, not published: publishing it is the human decision that triggers
      # the nuget.org workflow.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --draft
          --title "$GITHUB_REF_NAME"
          --generate-notes
          artifacts/*.nupkg artifacts/*.snupkg
